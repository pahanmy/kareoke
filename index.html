<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senarai Peserta Karaoke</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-900">

    <nav class="bg-indigo-600 p-4 text-white shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider">🎤 KAREOKE LIVERBOARD</h1>
            <a href="admin.html" class="bg-white text-indigo-600 px-3 py-1 rounded font-bold text-sm hover:bg-gray-200">Ke Paparan Admin</a>
        </div>
    </nav>

    <div class="container mx-auto p-4 max-w-5xl mt-6">
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-2xl font-bold mb-2 text-indigo-600">Senarai Rasmi Peserta</h2>
            <p class="text-sm text-gray-500 mb-6">Senarai keseluruhan peserta pertandingan dan status semasa mereka.</p>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-indigo-100 text-indigo-900">
                            <th class="p-3 border font-semibold">Giliran</th>
                            <th class="p-3 border font-semibold">Nama Peserta</th>
                            <th class="p-3 border font-semibold">Pilihan Lagu</th>
                            <th class="p-3 border font-semibold text-center">Status Tahap</th>
                        </tr>
                    </thead>
                    <tbody id="senarai-awam">
                        <tr><td colspan="4" class="p-4 text-center text-gray-500">Memuatkan data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCwDP8KCl2r6QL1DOAQTMGx5-pcwub9mYM",
            authDomain: "kareoke-83a74.firebaseapp.com",
            projectId: "kareoke-83a74",
            storageBucket: "kareoke-83a74.firebasestorage.app",
            messagingSenderId: "740423962434",
            appId: "1:740423962434:web:f3460cc576f33574e802db"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function muatNaikPaparanAwam() {
            try {
                const q = query(collection(db, "peserta"), orderBy("no_giliran", "asc"));
                const snap = await getDocs(q);
                const tbody = document.getElementById('senarai-awam');
                tbody.innerHTML = "";

                if(snap.empty) {
                    tbody.innerHTML = "<tr><td colspan='4' class='p-4 text-center text-gray-500'>Belum ada peserta didaftarkan.</td></tr>";
                    return;
                }

                snap.forEach(d => {
                    let p = d.data();
                    
                    // Format senarai lagu
                    let laguHTML = "<ul class='list-disc pl-4'>";
                    if(p.lagu && p.lagu.length > 0) {
                        p.lagu.forEach(l => {
                            laguHTML += `<li>${l.tajuk} <a href="${l.link}" target="_blank" class="text-blue-500 text-xs hover:underline">(Buka YT)</a></li>`;
                        });
                    } else {
                        laguHTML += "<li>Tiada maklumat lagu</li>";
                    }
                    laguHTML += "</ul>";

                    // Gaya visual khas jika layak ke Final
                    let trClass = p.status === 'Final' ? 'bg-green-50 border-green-200' : 'hover:bg-gray-50';
                    let statusBadge = p.status === 'Final' 
                        ? `<span class="bg-green-600 text-white px-3 py-1 rounded-full text-xs font-bold shadow-sm flex items-center justify-center gap-1">🌟 FINALIS</span>` 
                        : `<span class="bg-gray-200 text-gray-700 px-3 py-1 rounded-full text-xs font-bold">Saringan</span>`;

                    let tr = document.createElement('tr');
                    tr.className = trClass;
                    tr.innerHTML = `
                        <td class="p-3 border font-bold text-center text-lg">${p.no_giliran}</td>
                        <td class="p-3 border font-bold text-gray-800 uppercase">${p.nama}</td>
                        <td class="p-3 border">${laguHTML}</td>
                        <td class="p-3 border text-center">${statusBadge}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch(err) {
                console.error(err);
                document.getElementById('senarai-awam').innerHTML = "<tr><td colspan='4' class='p-4 text-center text-red-500'>Ralat memuatkan data. Sila refresh.</td></tr>";
            }
        }

        // Muat naik automatik bila halaman dibuka
        muatNaikPaparanAwam();
    </script>
</body>
</html>
