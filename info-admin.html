<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Info Majlis - Spark</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 font-sans antialiased text-gray-900 min-h-screen flex flex-col p-4">

    <!-- Butang Kembali ke Admin -->
    <div class="max-w-3xl mx-auto w-full mb-4">
        <a href="admin.html" class="inline-block bg-slate-800 text-white px-4 py-2 rounded-lg font-bold hover:bg-slate-700 transition"><i class="fas fa-arrow-left mr-2"></i> Kembali ke Pusat Kawalan</a>
    </div>

    <div class="max-w-3xl mx-auto w-full bg-white p-8 rounded-2xl shadow-lg border-t-4 border-indigo-600">
        <h1 class="text-2xl font-black mb-6 text-slate-800 uppercase tracking-wide"><i class="fas fa-cogs text-indigo-600 mr-2"></i> Tetapan Info Majlis & Penjurian</h1>
        
        <form id="form-info" class="space-y-6">
            
            <!-- Bahagian Info Asas -->
            <div class="bg-slate-50 p-5 rounded-xl border border-slate-200 space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Nama Pasangan / Acara Majlis</label>
                    <input type="text" id="nama_majlis" required class="w-full border-2 border-slate-200 p-3 rounded-xl focus:border-indigo-500 outline-none" placeholder="Contoh: Astri & Rifaie">
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Tarikh Acara</label>
                        <!-- Menggunakan type="date" untuk Calendar Picker -->
                        <input type="date" id="tarikh_acara" required class="w-full border-2 border-slate-200 p-3 rounded-xl focus:border-indigo-500 outline-none text-slate-700 font-bold">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Lokasi Majlis</label>
                        <input type="text" id="lokasi" required class="w-full border-2 border-slate-200 p-3 rounded-xl focus:border-indigo-500 outline-none" placeholder="Contoh: Kpg Lot Baru Belawai">
                    </div>
                </div>
            </div>

            <!-- Bahagian Tetapan Sistem Acara -->
            <div class="border-t-2 border-slate-100 pt-6 mt-4">
                <label class="block text-sm font-black text-indigo-700 uppercase tracking-wide mb-3"><i class="fas fa-sitemap mr-1"></i> Format & Masa Pertandingan</label>
                
                <div class="mb-4">
                    <label class="block text-xs font-bold text-gray-600 mb-1">Peringkat Pertandingan</label>
                    <select id="peringkat_pertandingan" onchange="kemaskiniPaparanMasa()" class="w-full border-2 border-indigo-200 bg-indigo-50 p-3 rounded-xl focus:border-indigo-500 outline-none font-bold text-indigo-900">
                        <option value="saringan-final">Sesi Saringan & Pusingan Final</option>
                        <option value="final-sahaja">Terus ke Pusingan Final Sahaja (Tiada Saringan)</option>
                    </select>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div id="kotak_masa_saringan">
                        <label class="block text-xs font-bold text-gray-600 mb-1">Masa Mula Sesi Saringan</label>
                        <!-- Menggunakan type="time" untuk Jam -->
                        <input type="time" id="masa_saringan" class="w-full border-2 border-slate-200 p-3 rounded-xl focus:border-indigo-500 outline-none font-bold text-slate-700">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Masa Mula Pusingan Final</label>
                        <!-- Menggunakan type="time" untuk Jam -->
                        <input type="time" id="masa_final" required class="w-full border-2 border-slate-200 p-3 rounded-xl focus:border-indigo-500 outline-none font-bold text-slate-700">
                    </div>
                </div>
            </div>

            <!-- Bahagian Tetapan Penjurian & Tema -->
            <div class="border-t-2 border-slate-100 pt-6 mt-4">
                <label class="block text-sm font-black text-indigo-700 uppercase tracking-wide mb-3"><i class="fas fa-gavel mr-1"></i> Kaedah Penjurian & Tema</label>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Pilihan Sistem Penjurian</label>
                        <select id="kaedah_penjurian" class="w-full border-2 border-slate-200 p-3 rounded-xl focus:border-indigo-500 outline-none font-bold">
                            <option value="juri-100">Juri Profesional 100%</option>
                            <option value="juri-bebas">Undian Awam / Juri Bebas</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Tema Warna Muka Depan</label>
                        <select id="tema_warna" class="w-full border-2 border-slate-200 p-3 rounded-xl focus:border-indigo-500 outline-none font-bold">
                            <option value="tema-pink">🌸 Pink & Purple</option>
                            <option value="tema-blue">🌊 Biru & Indigo</option>
                            <option value="tema-emerald">🍃 Hijau Zamrud</option>
                            <option value="tema-gold">👑 Emas & Kuning</option>
                        </select>
                    </div>
                </div>
            </div>

            <button type="submit" id="btn-simpan" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-xl shadow-md transition text-lg uppercase tracking-wider mt-4">
                <i class="fas fa-save mr-2"></i> Simpan Semua Tetapan
            </button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCwDP8KCl2r6QL1DOAQTMGx5-pcwub9mYM",
            authDomain: "kareoke-83a74.firebaseapp.com",
            projectId: "kareoke-83a74",
            storageBucket: "kareoke-83a74.firebasestorage.app",
            messagingSenderId: "740423962434",
            appId: "1:740423962434:web:f3460cc576f33574e802db"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const docRef = doc(db, "tetapan", "info_majlis");

        // Fungsi sembunyikan kotak masa saringan jika pilih "Terus Final"
        window.kemaskiniPaparanMasa = function() {
            const formatPeringkat = document.getElementById('peringkat_pertandingan').value;
            const kotakSaringan = document.getElementById('kotak_masa_saringan');
            const inputSaringan = document.getElementById('masa_saringan');

            if(formatPeringkat === 'final-sahaja') {
                kotakSaringan.classList.add('hidden');
                inputSaringan.removeAttribute('required'); // Buang required supaya form boleh dihantar
                inputSaringan.value = ""; // Kosongkan nilai
            } else {
                kotakSaringan.classList.remove('hidden');
                inputSaringan.setAttribute('required', 'true');
            }
        }

        async function muatData() {
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('nama_majlis').value = data.nama_majlis || "";
                document.getElementById('tarikh_acara').value = data.tarikh_acara || "";
                document.getElementById('lokasi').value = data.lokasi || "";
                
                document.getElementById('peringkat_pertandingan').value = data.peringkat_pertandingan || "saringan-final";
                window.kemaskiniPaparanMasa(); // Selaraskan paparan sebaik data dimuat turun

                document.getElementById('masa_saringan').value = data.masa_saringan || "";
                document.getElementById('masa_final').value = data.masa_final || "";
                document.getElementById('tema_warna').value = data.tema_warna || "tema-pink";
                document.getElementById('kaedah_penjurian').value = data.kaedah_penjurian || "juri-100";
            } else {
                window.kemaskiniPaparanMasa(); // Jika data kosong, pastikan kotak diselaraskan
            }
        }

        document.getElementById('form-info').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-simpan');
            btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Menyimpan...`;
            
            try {
                await setDoc(docRef, {
                    nama_majlis: document.getElementById('nama_majlis').value,
                    tarikh_acara: document.getElementById('tarikh_acara').value,
                    lokasi: document.getElementById('lokasi').value,
                    peringkat_pertandingan: document.getElementById('peringkat_pertandingan').value,
                    masa_saringan: document.getElementById('masa_saringan').value,
                    masa_final: document.getElementById('masa_final').value,
                    tema_warna: document.getElementById('tema_warna').value,
                    kaedah_penjurian: document.getElementById('kaedah_penjurian').value
                });
                alert("Tetapan berjaya disimpan!");
            } catch (error) { alert("Ralat: " + error.message); }
            btn.innerHTML = `<i class="fas fa-save mr-2"></i> Simpan Semua Tetapan`;
        });

        muatData();
    </script>
</body>
</html>
