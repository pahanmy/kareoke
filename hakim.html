<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Penilaian Hakim</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Animasi Modal Canggih */
        .modal-masuk { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-900 h-screen flex flex-col">

    <nav class="bg-indigo-900 p-4 text-white shadow-lg z-10">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider">🎙️ PORTAL HAKIM</h1>
            <div id="nama-pengguna" class="font-medium hidden">Selamat datang, <span id="label-hakim" class="text-amber-400 font-bold"></span></div>
        </div>
    </nav>

    <div id="skrin-login" class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center border-t-4 border-indigo-600">
            <h2 class="text-2xl font-black text-gray-800 mb-2">Log Masuk Hakim</h2>
            <p class="text-sm text-gray-500 mb-6">Sila masukkan No. Kad Pengenalan anda untuk meneruskan penilaian.</p>
            
            <input type="text" id="input-ic" class="w-full border-2 border-gray-300 p-3 rounded-lg text-center text-lg font-bold tracking-widest mb-4 focus:outline-none focus:border-indigo-600 transition" placeholder="NO. IC (Tanpa Sempang)">
            
            <button onclick="sahkanHakim()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-all">Sahkan Identiti ➔</button>
            <p id="msg-login" class="text-red-500 mt-3 text-sm font-semibold hidden">No IC tidak dijumpai di dalam sistem.</p>
        </div>
    </div>

    <div id="skrin-dashboard" class="hidden flex-grow flex flex-col p-4 sm:p-6 container mx-auto max-w-5xl">
        
        <div class="bg-white p-4 rounded-xl shadow-sm mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h3 class="font-bold text-gray-700">Tahap Pertandingan Sesi Ini:</h3>
            </div>
            <select id="pilih-tahap" onchange="muatPesertaUntukDinilai()" class="border-2 border-indigo-200 bg-indigo-50 text-indigo-900 font-bold p-2 rounded-lg outline-none cursor-pointer w-full sm:w-auto">
                <option value="Saringan">Pusingan Saringan</option>
                <option value="Final">Pusingan Final</option>
            </select>
        </div>

        <div id="grid-peserta" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </div>

    <div id="modal-penilaian" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl modal-masuk overflow-hidden flex flex-col max-h-[90vh]">
            
            <div class="bg-indigo-600 p-4 text-white flex justify-between items-start">
                <div>
                    <span id="modal-giliran" class="bg-white/20 px-2 py-1 rounded text-xs font-bold uppercase tracking-wider">Giliran 1</span>
                    <h2 id="modal-nama" class="text-2xl font-black mt-1 uppercase">Nama Peserta</h2>
                </div>
                <button onclick="tutupModal()" class="text-white hover:text-red-300 font-black text-2xl leading-none">&times;</button>
            </div>

            <div class="p-6 overflow-y-auto space-y-6 flex-grow">
                
                <div class="bg-gray-50 p-3 rounded-lg border border-gray-200">
                    <p class="text-xs font-bold text-gray-500 uppercase mb-1">Lagu Dibawa</p>
                    <div id="modal-lagu" class="text-sm font-medium text-gray-800"></div>
                </div>

                <input type="hidden" id="modal-id-peserta">
                
                <div class="space-y-4">
                    <div class="bg-white border-2 border-gray-100 rounded-xl p-4 shadow-sm relative">
                        <label class="block font-bold text-gray-700">🎤 Vokal <span class="text-sm font-normal text-gray-500">(Wajaran 50%)</span></label>
                        <input type="number" id="m-vokal" min="0" max="100" class="w-full text-right text-2xl font-black text-indigo-700 border-b-2 border-gray-200 focus:border-indigo-600 outline-none mt-2 pb-1" placeholder="0 - 100" oninput="kiraMarkahLive()">
                    </div>
                    <div class="bg-white border-2 border-gray-100 rounded-xl p-4 shadow-sm relative">
                        <label class="block font-bold text-gray-700">🕺 Persembahan <span class="text-sm font-normal text-gray-500">(Wajaran 30%)</span></label>
                        <input type="number" id="m-persembahan" min="0" max="100" class="w-full text-right text-2xl font-black text-indigo-700 border-b-2 border-gray-200 focus:border-indigo-600 outline-none mt-2 pb-1" placeholder="0 - 100" oninput="kiraMarkahLive()">
                    </div>
                    <div class="bg-white border-2 border-gray-100 rounded-xl p-4 shadow-sm relative">
                        <label class="block font-bold text-gray-700">🎭 Penghayatan <span class="text-sm font-normal text-gray-500">(Wajaran 20%)</span></label>
                        <input type="number" id="m-penghayatan" min="0" max="100" class="w-full text-right text-2xl font-black text-indigo-700 border-b-2 border-gray-200 focus:border-indigo-600 outline-none mt-2 pb-1" placeholder="0 - 100" oninput="kiraMarkahLive()">
                    </div>
                </div>

                <div class="bg-indigo-50 border-2 border-indigo-200 rounded-xl p-4 text-center">
                    <p class="text-sm font-bold text-indigo-800 mb-1">JUMLAH KESELURUHAN</p>
                    <div id="modal-total" class="text-5xl font-black text-indigo-600">0.00<span class="text-2xl text-indigo-400">%</span></div>
                </div>

            </div>

            <div class="p-4 border-t border-gray-100 bg-gray-50">
                <button onclick="hantarKeputusan()" class="w-full bg-green-500 hover:bg-green-600 text-white text-lg font-bold py-3 rounded-xl shadow-lg transition transform hover:-translate-y-1">✅ Hantar Keputusan</button>
            </div>
        </div>
    </div>


    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // MASUKKAN CONFIG FIREBASE ANDA DI SINI
        const firebaseConfig = {
            apiKey: "AIzaSyCwDP8KCl2r6QL1DOAQTMGx5-pcwub9mYM",
            authDomain: "kareoke-83a74.firebaseapp.com",
            projectId: "kareoke-83a74",
            storageBucket: "kareoke-83a74.firebasestorage.app",
            messagingSenderId: "740423962434",
            appId: "1:740423962434:web:f3460cc576f33574e802db"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // State Pengguna Global
        let namaHakimSemasa = "";
        let senaraiPesertaMemori = [];

        // 1. LOGIK PENGESAHAN HAKIM
        window.sahkanHakim = async function() {
            const icInput = document.getElementById('input-ic').value.trim();
            if(!icInput) return;

            const q = query(collection(db, "hakim"), where("ic", "==", icInput));
            const snap = await getDocs(q);

            if(!snap.empty) {
                // Berjaya Login
                namaHakimSemasa = snap.docs[0].data().nama;
                document.getElementById('skrin-login').classList.add('hidden');
                document.getElementById('skrin-dashboard').classList.remove('hidden');
                document.getElementById('nama-pengguna').classList.remove('hidden');
                document.getElementById('label-hakim').innerText = namaHakimSemasa;
                
                // Load peserta
                muatPesertaUntukDinilai();
            } else {
                // Gagal Login
                const msg = document.getElementById('msg-login');
                msg.classList.remove('hidden');
                setTimeout(() => msg.classList.add('hidden'), 3000);
            }
        }

        // 2. LOAD KAD PESERTA KE DASHBOARD
        window.muatPesertaUntukDinilai = async function() {
            const tahap = document.getElementById('pilih-tahap').value;
            const q = query(collection(db, "peserta"), where("status", "==", tahap));
            const snap = await getDocs(q);
            
            senaraiPesertaMemori = [];
            const grid = document.getElementById('grid-peserta');
            grid.innerHTML = "";

            if(snap.empty) {
                grid.innerHTML = `<div class="col-span-full text-center text-gray-500 py-10">Tiada peserta untuk fasa ${tahap} setakat ini.</div>`;
                return;
            }

            // Susun ikut nombor giliran manually (sebab orderBy kadang perlukan index di Firebase)
            snap.forEach(d => { let p = d.data(); p.id = d.id; senaraiPesertaMemori.push(p); });
            senaraiPesertaMemori.sort((a,b) => a.no_giliran - b.no_giliran);

            senaraiPesertaMemori.forEach(p => {
                // Cek jika hakim ini sudah menilai peserta ini
                let sudahDinilai = false;
                let markahSediaAda = 0;
                
                if(tahap === "Saringan" && p.markah_saringan && p.markah_saringan[namaHakimSemasa]) {
                    sudahDinilai = true; markahSediaAda = p.markah_saringan[namaHakimSemasa];
                } else if(tahap === "Final" && p.markah_final && p.markah_final[namaHakimSemasa]) {
                    sudahDinilai = true; markahSediaAda = p.markah_final[namaHakimSemasa];
                }

                let statusVisual = sudahDinilai 
                    ? `<div class="bg-green-100 text-green-700 px-3 py-1 text-xs font-bold rounded-full mt-2 inline-block">✅ Selesai Dinilai (${markahSediaAda}%)</div>` 
                    : `<div class="bg-amber-100 text-amber-700 px-3 py-1 text-xs font-bold rounded-full mt-2 inline-block">⏳ Belum Dinilai</div>`;

                let kad = document.createElement('div');
                kad.className = `bg-white border ${sudahDinilai ? 'border-green-300' : 'border-gray-200'} rounded-xl p-5 shadow-sm hover:shadow-md transition cursor-pointer relative overflow-hidden group`;
                kad.onclick = () => bukaModalPenilaian(p.id);
                kad.innerHTML = `
                    <div class="absolute top-0 right-0 bg-gray-100 text-gray-400 font-black text-6xl opacity-10 -mt-2 -mr-2 group-hover:scale-110 transition">#${p.no_giliran}</div>
                    <div class="text-sm font-bold text-gray-400 uppercase">Giliran ${p.no_giliran}</div>
                    <div class="text-xl font-black text-gray-800 uppercase mt-1 line-clamp-1">${p.nama}</div>
                    ${statusVisual}
                `;
                grid.appendChild(kad);
            });
        }

        // 3. LOGIK MODAL PENILAIAN
        window.bukaModalPenilaian = function(id) {
            const p = senaraiPesertaMemori.find(x => x.id === id);
            if(!p) return;

            document.getElementById('modal-id-peserta').value = p.id;
            document.getElementById('modal-giliran').innerText = `Giliran ${p.no_giliran}`;
            document.getElementById('modal-nama').innerText = p.nama;

            // Papar lagu
            let senaraiLaguHTML = "";
            if(p.lagu && p.lagu.length > 0) {
                p.lagu.forEach(l => senaraiLaguHTML += `• ${l.tajuk}<br>`);
            } else senaraiLaguHTML = "Tiada maklumat lagu";
            document.getElementById('modal-lagu').innerHTML = senaraiLaguHTML;

            // Reset Form markah
            document.getElementById('m-vokal').value = "";
            document.getElementById('m-persembahan').value = "";
            document.getElementById('m-penghayatan').value = "";
            document.getElementById('modal-total').innerHTML = `0.00<span class="text-2xl text-indigo-400">%</span>`;

            document.getElementById('modal-penilaian').classList.remove('hidden');
        }

        window.tutupModal = function() {
            document.getElementById('modal-penilaian').classList.add('hidden');
        }

        window.kiraMarkahLive = function() {
            // Hadkan max input 100
            ['m-vokal', 'm-persembahan', 'm-penghayatan'].forEach(id => {
                let el = document.getElementById(id);
                if(el.value > 100) el.value = 100;
            });

            let v = parseFloat(document.getElementById('m-vokal').value) || 0;
            let p = parseFloat(document.getElementById('m-persembahan').value) || 0;
            let h = parseFloat(document.getElementById('m-penghayatan').value) || 0;

            let total = (v * 0.50) + (p * 0.30) + (h * 0.20);
            document.getElementById('modal-total').innerHTML = `${total.toFixed(2)}<span class="text-2xl text-indigo-400">%</span>`;
            return total;
        }

        window.hantarKeputusan = async function() {
            const v = document.getElementById('m-vokal').value;
            const p = document.getElementById('m-persembahan').value;
            const h = document.getElementById('m-penghayatan').value;

            if(v === "" || p === "" || h === "") {
                alert("Sila isi markah untuk semua kriteria!");
                return;
            }

            const total = kiraMarkahLive();
            const idPeserta = document.getElementById('modal-id-peserta').value;
            const tahap = document.getElementById('pilih-tahap').value;

            try {
                const docRef = doc(db, "peserta", idPeserta);
                const kemaskini = {};
                
                if(tahap === "Saringan") kemaskini[`markah_saringan.${namaHakimSemasa}`] = total;
                else kemaskini[`markah_final.${namaHakimSemasa}`] = total;

                // Animasi butang loading (Optional tapi canggih)
                const btn = event.currentTarget;
                btn.innerText = "⏳ Sedang Menghantar...";
                
                await updateDoc(docRef, kemaskini);
                
                btn.innerText = "✅ Berjaya!";
                setTimeout(() => {
                    tutupModal();
                    muatPesertaUntukDinilai(); // Refresh dashboard untuk update badge (Sudah Dinilai)
                }, 1000);

            } catch (err) {
                alert("Ralat menghantar markah: " + err.message);
            }
        }
    </script>
</body>
</html>
