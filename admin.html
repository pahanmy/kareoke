<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pusat Kawalan Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 font-sans antialiased text-gray-900">

    <nav class="bg-slate-800 p-4 text-white shadow-md">
        <div class="container mx-auto flex flex-wrap justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider text-amber-400">⚙️ PUSAT KAWALAN ADMIN</h1>
            <div class="flex space-x-2 mt-2 sm:mt-0 flex-wrap">
                <button onclick="tukarTab('tab-daftar-peserta')" class="px-3 py-1 rounded hover:bg-slate-700 bg-slate-900 text-sm font-medium">1. Urus Peserta</button>
                <button onclick="tukarTab('tab-daftar-hakim')" class="px-3 py-1 rounded hover:bg-slate-700 text-sm font-medium">2. Urus Hakim</button>
                <button onclick="tukarTab('tab-urus-final')" class="px-3 py-1 rounded hover:bg-slate-700 text-sm font-medium">3. Urus Saringan</button>
                <button onclick="tukarTab('tab-keputusan')" class="px-3 py-1 rounded hover:bg-slate-700 text-sm font-medium">4. Keputusan Final</button>
                <a href="hakim.html" target="_blank" class="px-3 py-1 rounded bg-blue-600 hover:bg-blue-500 text-sm font-medium ml-4">Portal Hakim ➔</a>
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-4 max-w-5xl mt-4">

        <div id="tab-daftar-peserta" class="tab-content bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-2xl font-bold mb-4 text-slate-800">Pendaftaran & Senarai Peserta</h2>
            
            <form id="form-peserta" class="space-y-4 bg-slate-50 p-4 rounded border">
                <input type="hidden" id="edit-id-peserta">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium">Nama Peserta</label>
                        <input type="text" id="nama-peserta" required class="w-full border p-2 rounded mt-1">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">No. IC (Tanpa Sempang)</label>
                        <input type="text" id="ic-peserta" required class="w-full border p-2 rounded mt-1" placeholder="Cth: 900101135566">
                    </div>
                </div>
                
                <div id="ruangan-lagu" class="space-y-2">
                    <label class="block text-sm font-medium">Lagu & Pautan YouTube</label>
                    <div class="flex space-x-2 item-lagu">
                        <input type="text" placeholder="Tajuk Lagu" required class="w-1/2 border p-2 rounded">
                        <input type="url" placeholder="Pautan YouTube" required class="w-1/2 border p-2 rounded">
                    </div>
                </div>
                <button type="submit" id="btn-submit-peserta" class="w-full bg-slate-800 text-white p-2 rounded hover:bg-slate-700 font-bold">Daftar Peserta Baru</button>
            </form>

            <div class="mt-8 overflow-x-auto">
                <h3 class="font-bold text-lg mb-2">Senarai Peserta</h3>
                <button onclick="muatSenaraiPeserta()" class="text-sm bg-gray-200 px-3 py-1 rounded mb-2">🔄 Refresh</button>
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-200">
                            <th class="p-2 border">Giliran</th>
                            <th class="p-2 border">Nama</th>
                            <th class="p-2 border">No. IC</th>
                            <th class="p-2 border">Tindakan</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-peserta"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-daftar-hakim" class="tab-content bg-white p-6 rounded-lg shadow-md hidden">
            <h2 class="text-2xl font-bold mb-4 text-slate-800">Pendaftaran & Senarai Hakim</h2>
            <form id="form-hakim" class="space-y-4 bg-slate-50 p-4 rounded border">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium">Nama Hakim</label>
                        <input type="text" id="nama-hakim" required class="w-full border p-2 rounded mt-1">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">No. IC (Log Masuk Portal Hakim)</label>
                        <input type="text" id="ic-hakim" required class="w-full border p-2 rounded mt-1" placeholder="Cth: 850202145566">
                    </div>
                </div>
                <button type="submit" class="w-full bg-slate-800 text-white p-2 rounded hover:bg-slate-700 font-bold">Daftar Hakim</button>
            </form>
            
            <div class="mt-8 overflow-x-auto">
                <h3 class="font-bold text-lg mb-2">Senarai Hakim Berdaftar</h3>
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-200">
                            <th class="p-2 border">Nama</th>
                            <th class="p-2 border">No. IC</th>
                            <th class="p-2 border text-center">Tindakan</th>
                        </tr>
                    </thead>
                    <tbody id="senarai-hakim"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-urus-final" class="tab-content bg-white p-6 rounded-lg shadow-md hidden">
            <h2 class="text-2xl font-bold mb-2 text-slate-800">Pengurusan Saringan</h2>
            <button onclick="muatNaikCartaSaringan()" class="bg-slate-200 text-slate-800 px-4 py-2 rounded mb-4 font-semibold text-sm">🔄 Kemaskini Carta Saringan</button>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-gray-200"><th class="p-2 border">Ked.</th><th class="p-2 border">Giliran</th><th class="p-2 border">Nama</th><th class="p-2 border">Purata Markah</th><th class="p-2 border">Status</th><th class="p-2 border">Tindakan</th></tr>
                    </thead>
                    <tbody id="tabel-saringan"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-keputusan" class="tab-content bg-white p-6 rounded-lg shadow-md hidden text-center">
            <h2 class="text-2xl font-bold mb-2 text-amber-500">🏆 KEPUTUSAN MUKTAMAD (FINAL)</h2>
            <button onclick="muatNaikKeputusanFinal()" class="bg-amber-500 text-white px-6 py-2 rounded-full mb-6 font-bold shadow">🔄 Ambil Keputusan Terkini</button>
            <div id="papan-pemenang" class="space-y-3 max-w-md mx-auto"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // MASUKKAN CONFIG FIREBASE ANDA DI SINI
        const firebaseConfig = {
            apiKey: "AIzaSyCwDP8KCl2r6QL1DOAQTMGx5-pcwub9mYM",
            authDomain: "kareoke-83a74.firebaseapp.com",
            projectId: "kareoke-83a74",
            storageBucket: "kareoke-83a74.firebasestorage.app",
            messagingSenderId: "740423962434",
            appId: "1:740423962434:web:f3460cc576f33574e802db"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.tukarTab = function(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            event.currentTarget.parentNode.querySelectorAll('button').forEach(btn => btn.classList.remove('bg-slate-900'));
            event.currentTarget.classList.add('bg-slate-900');

            if(tabId === 'tab-daftar-peserta') muatSenaraiPeserta();
            if(tabId === 'tab-daftar-hakim') muatSenaraiHakim();
            if(tabId === 'tab-urus-final') muatNaikCartaSaringan();
            if(tabId === 'tab-keputusan') muatNaikKeputusanFinal();
        }

        // --- PENGURUSAN PESERTA ---
        document.getElementById('form-peserta').addEventListener('submit', async (e) => {
            e.preventDefault();
            const idEdit = document.getElementById('edit-id-peserta').value;
            const nama = document.getElementById('nama-peserta').value;
            const ic = document.getElementById('ic-peserta').value;
            
            let senaraiLagu = [];
            document.querySelectorAll('.item-lagu').forEach(el => {
                const inputs = el.querySelectorAll('input');
                if(inputs[0].value) senaraiLagu.push({ tajuk: inputs[0].value, link: inputs[1].value });
            });

            try {
                if(idEdit) {
                    await updateDoc(doc(db, "peserta", idEdit), { nama, ic, lagu: senaraiLagu });
                    alert("Data peserta dikemaskini!");
                } else {
                    const snap = await getDocs(query(collection(db, "peserta")));
                    await addDoc(collection(db, "peserta"), {
                        nama, ic, no_giliran: snap.size + 1, lagu: senaraiLagu, status: "Saringan", markah_saringan: {}, markah_final: {}
                    });
                    alert("Peserta berjaya ditambah!");
                }
                document.getElementById('form-peserta').reset();
                document.getElementById('edit-id-peserta').value = "";
                document.getElementById('btn-submit-peserta').innerText = "Daftar Peserta Baru";
                muatSenaraiPeserta();
            } catch (err) { alert(err.message); }
        });

        window.muatSenaraiPeserta = async function() {
            const snap = await getDocs(query(collection(db, "peserta"), orderBy("no_giliran", "asc")));
            const tbody = document.getElementById('tabel-peserta'); tbody.innerHTML = "";
            snap.forEach(d => {
                let p = d.data();
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-2 border font-bold text-center">${p.no_giliran}</td>
                        <td class="p-2 border">${p.nama}</td>
                        <td class="p-2 border">${p.ic}</td>
                        <td class="p-2 border text-center">
                            <button onclick="editPeserta('${d.id}', '${p.nama}', '${p.ic}')" class="text-blue-600 font-bold px-2">Edit</button>
                            <button onclick="padamPeserta('${d.id}')" class="text-red-600 font-bold px-2">Padam</button>
                        </td>
                    </tr>`;
            });
        }

        window.editPeserta = function(id, nama, ic) {
            document.getElementById('edit-id-peserta').value = id;
            document.getElementById('nama-peserta').value = nama;
            document.getElementById('ic-peserta').value = ic;
            document.getElementById('btn-submit-peserta').innerText = "Kemaskini Peserta";
            window.scrollTo(0,0);
        }

        window.padamPeserta = async function(id) {
            if(confirm("Padam peserta ini? Tindakan tidak boleh diundur.")) {
                await deleteDoc(doc(db, "peserta", id));
                muatSenaraiPeserta();
            }
        }

        // --- PENGURUSAN HAKIM ---
        document.getElementById('form-hakim').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nama = document.getElementById('nama-hakim').value;
            const ic = document.getElementById('ic-hakim').value;
            try {
                await addDoc(collection(db, "hakim"), { nama, ic });
                document.getElementById('form-hakim').reset();
                muatSenaraiHakim();
            } catch(err) { alert(err.message); }
        });

        window.muatSenaraiHakim = async function() {
            const snap = await getDocs(collection(db, "hakim"));
            const tbody = document.getElementById('senarai-hakim'); tbody.innerHTML = "";
            snap.forEach(d => {
                tbody.innerHTML += `
                    <tr>
                        <td class="p-2 border">${d.data().nama}</td>
                        <td class="p-2 border">${d.data().ic}</td>
                        <td class="p-2 border text-center"><button onclick="padamHakim('${d.id}')" class="text-red-600 font-bold">Padam</button></td>
                    </tr>`;
            });
        }

        window.padamHakim = async function(id) {
            if(confirm("Padam hakim ini?")) { await deleteDoc(doc(db, "hakim", id)); muatSenaraiHakim(); }
        }

        // Muat tab awal
        muatSenaraiPeserta();
        
        // (Kod untuk urus final & keputusan dikekalkan dari versi asal - rujuk jawapan sebelumnya jika mahu paste penuh)
        window.muatNaikCartaSaringan = async function() { /* Kod saringan sedia ada */ }
        window.setKeFinal = async function(id, layak) { /* Kod ke final sedia ada */ }
        window.muatNaikKeputusanFinal = async function() { /* Kod keputusan final sedia ada */ }
    </script>
</body>
</html>
